<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ebe8e1"><title>我家 · 3D V1</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ebe8e1;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}model-viewer{width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#faf9f5,#dedad0)}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.card{background:#ffffffde;backdrop-filter:blur(12px);padding:10px 12px;border-radius:14px;box-shadow:0 6px 22px #0002}.card b{display:block;font-size:14px}.card small{font-size:11px;color:#666}.bottom{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}.pill,button{border:0;border-radius:999px;padding:9px 13px;background:#111d;color:#fff;font-size:12px;white-space:nowrap}.views{position:fixed;right:12px;top:72px;display:flex;flex-direction:column;gap:7px;z-index:6}.views button{background:#ffffffdf;color:#222;box-shadow:0 3px 14px #0002}.views button:active{transform:scale(.97)}</style></head><body><div class="top"><div class="card"><b>我家 · 3D V1</b><small>三房 · 阳台并入客厅 · 手机查看版</small></div></div><model-viewer id="mv" src="House_Mobile.glb" camera-controls touch-action="pan-y" shadow-intensity="1.15" exposure="1.05" environment-image="neutral" camera-orbit="30deg 54deg 15m" camera-target="5.1m 4.1m 0.7m" min-camera-orbit="auto 12deg 2.5m" max-camera-orbit="auto 88deg 28m" field-of-view="35deg" interpolation-decay="120" ar ar-modes="webxr scene-viewer quick-look"></model-viewer><div class="views"><button data-o="30deg 54deg 15m" data-t="5.1m 4.1m .7m">鸟瞰</button><button data-o="-65deg 68deg 7m" data-t="2.4m 3.7m 1m">客厅</button><button data-o="150deg 70deg 5m" data-t="8.8m 3.2m 1m">主卧</button><button data-o="145deg 70deg 4.5m" data-t="5.9m 2.8m 1m">次卧</button><button data-o="35deg 70deg 4.2m" data-t="7.3m 7m 1m">北卧</button></div><div class="bottom"><div class="pill">单指旋转 · 双指缩放 · 按钮切房间</div></div><script>const m=document.querySelector('#mv');document.querySelectorAll('button[data-o]').forEach(b=>b.onclick=()=>{m.cameraOrbit=b.dataset.o;m.cameraTarget=b.dataset.t;m.jumpCameraToGoal()})</script></body></html>
