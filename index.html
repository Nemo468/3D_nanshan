<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>我家 · Final 3D</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e2d8;font-family:system-ui}model-viewer{width:100%;height:100%;background:linear-gradient(#f7f3ed,#ded6ca)}.h{position:fixed;left:12px;top:12px;z-index:5;background:#fffc;padding:10px 13px;border-radius:14px;box-shadow:0 2px 14px #0002}.b{position:fixed;left:10px;right:10px;bottom:14px;z-index:6;display:flex;gap:7px;overflow:auto}button{border:0;border-radius:999px;padding:9px 13px;background:#ffff;white-space:nowrap;box-shadow:0 2px 10px #0002}</style></head><body><div class="h"><b>我家 · Final 3D</b><br><small>拖动旋转 · 双指缩放</small></div><model-viewer id="m" src="House_Mobile_FINAL.glb" camera-controls touch-action="pan-y" shadow-intensity="1.2" shadow-softness=".8" exposure="1.05" environment-image="neutral" camera-orbit="35deg 48deg 18m" min-camera-orbit="auto 15deg 4m" max-camera-orbit="auto 88deg 28m"></model-viewer><div class="b"><button data-o="35deg 48deg 18m">鸟瞰</button><button data-o="15deg 67deg 8m">客厅</button><button data-o="-35deg 66deg 6m">主卧</button><button data-o="120deg 66deg 6m">卧室</button></div><script>const m=document.querySelector('#m');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.cameraOrbit=b.dataset.o;m.jumpCameraToGoal()})</script></body></html>
